[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
unicode-ident = "1"
krelpin_ast = { path = "crates/krelpin_ast" }
krelpin_driver = { path = "crates/krelpin_driver" }
krelpin_errors = { path = "crates/krelpin_errors" }
krelpin_expand = { path = "crates/krelpin_expand" }
krelpin_lexer = { path = "crates/krelpin_lexer" }
krelpin_parse = { path = "crates/krelpin_parse" }
krelpin_resolve = { path = "crates/krelpin_resolve" }
krelpin_span = { path = "crates/krelpin_span" }
krelpin_sysroot = { path = "crates/krelpin_sysroot" }
krelpin_typeck = { path = "crates/krelpin_typeck" }
